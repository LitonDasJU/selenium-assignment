<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice Test Login</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
    }

    .header {
        background: #1f4e79;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .container {
        width: 420px;
        margin: 70px auto;
        background: white;
        padding: 35px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    h2 {
        text-align: center;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #aaa;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        background: #1f4e79;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #163a5c;
    }

    #errorMessage {
        text-align: center;
        margin-top: 20px;
        color: red;
        font-weight: bold;
    }

    .credentials {
        margin-top: 25px;
        padding: 15px;
        background: #eef4f8;
        line-height: 1.6;
    }

    /* SUCCESS PAGE */

    #successPage {
        display: none;
        text-align: center;
    }

    #successPage h1 {
        color: green;
        font-size: 32px;
    }

    #successPage p {
        font-size: 18px;
        line-height: 1.6;
    }

    #logout {
        background: #d32f2f;
    }

    #logout:hover {
        background: #a82020;
    }

</style>
</head>

<body>

<div class="header">
    <h1>Assignment 01: Automation Testing</h1>
</div>


<!-- LOGIN PAGE -->

<div class="container" id="loginPage">

    <h2>Test Login</h2>

    <form id="loginForm">

        <label for="studentID">Student ID</label>

        <input
            type="text"
            id="studentID"
            placeholder="Enter Student ID"
            required>

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            required>

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required>

        <button
            type="submit"
            id="submit">
            Submit
        </button>

    </form>

    <div id="errorMessage"></div>

    <div class="credentials">

        <strong>Test Credentials</strong>

        <br><br>

        Student ID: 262024

        <br>

        Username: student

        <br>

        Password: Password123

    </div>

</div>


<!-- SUCCESSFUL LOGIN PAGE -->

<div class="container" id="successPage">

    <h1 id="successTitle">
        Congratulations!
    </h1>

    <h2>
        Logged In Successfully
    </h2>

    <p id="successMessage">
        You successfully logged in.
    </p>

    <p>
        Welcome,
        <strong>Liton Das</strong>
    </p>

    <p>
        Student ID:
        <strong>262024</strong>
    </p>

    <button id="logout">
        Log out
    </button>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginPage =
    document.getElementById("loginPage");

const successPage =
    document.getElementById("successPage");

const errorMessage =
    document.getElementById("errorMessage");


/* LOGIN */

loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const studentID =
        document.getElementById("studentID").value;

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (studentID !== "262024") {

        errorMessage.innerText =
            "Your Student ID is invalid!";

    }

    else if (username !== "student") {

        errorMessage.innerText =
            "Your username is invalid!";

    }

    else if (password !== "Password123") {

        errorMessage.innerText =
            "Your password is invalid!";

    }

    else {

        errorMessage.innerText = "";

        /* Change URL */

        window.location.hash =
            "logged-in-successfully";

        /* Hide login page */

        loginPage.style.display =
            "none";

        /* Show success page */

        successPage.style.display =
            "block";
    }

});


/* LOGOUT */

document.getElementById("logout")
.addEventListener("click", function() {

    /* Remove successful login URL */

    history.replaceState(
        null,
        "",
        window.location.pathname
    );

    /* Hide success page */

    successPage.style.display =
        "none";

    /* Show login page */

    loginPage.style.display =
        "block";

    /* Clear form */

    loginForm.reset();

});

</script>

</body>
</html>
